<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian District · Coruscant</title><style>body{margin:0;overflow:hidden;font:14px system-ui;background:#abbfc7;color:#e3ede7}header{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#182b34ed;border:1px solid #638186;border-radius:12px;padding:14px}h1{font-size:18px;margin:0;margin-right:auto}button,a{color:#d7e6df;background:#243d46;border:1px solid #577c83;border-radius:7px;padding:9px 12px;text-decoration:none;cursor:pointer}.active{background:#a6d7bd;color:#163b37}footer{position:absolute;bottom:16px;left:16px;max-width:630px;background:#182b34ed;border-radius:10px;padding:14px;line-height:1.5}#stats{display:block;font-size:12px;color:#a9c3c5;margin-top:5px}</style></head><body><header><h1>Meridian residential district</h1><button data-view="district">District</button><button data-view="residence">Apartment & pad</button><button data-view="tower">Tower interior</button><button data-view="market">Mid city</button><button data-view="tunnel">Underground</button><button data-view="sinkhole">Industrial sinkhole</button><button data-view="undercity">Undercity streets</button><label><input id="cut" type="checkbox">Peek inside</label><a href="../index.html?demo=coruscant-residential">Edit map</a></header><footer><span id="caption"></span><span id="stats"></span></footer><script type="module">
import * as T from '../vendor/three.module.js';import {OrbitControls} from '../vendor/OrbitControls.js';import {buildPart} from '../src/core/geometry.js';import {prepareInteriorCuts} from '../src/interiors/interior-hull-cuts.js';import {geometryStats} from '../src/core/mesh-budget.js';
const project=await fetch('../examples/projects/coruscant-residential.building.json').then(r=>r.json()),scene=new T.Scene(),camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.15,1400),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);scene.background=new T.Color('#b1c2c9');scene.fog=new T.Fog('#b1c2c9',240,850);scene.add(new T.HemisphereLight('#fff0d8','#395b6e',2.5));const sun=new T.DirectionalLight('#ffe6c5',3);sun.position.set(-70,110,45);scene.add(sun);const cuts=prepareInteriorCuts(project.parts),models=[];for(const part of project.parts){const model=buildPart(part,{parts:project.parts,openingCuts:cuts,batch:true});model.userData.part=part;models.push(model);scene.add(model);}const controls=new OrbitControls(camera,renderer.domElement);controls.maxDistance=1000;const cut=document.querySelector('#cut'),draw=()=>renderer.render(scene,camera);let view='district';
function reveal(){for(const model of models)model.traverse(m=>{if(!m.isMesh)return;m.visible=true;if(m.userData.interiorCeiling||m.userData.hallwayCeiling)m.visible=!cut.checked;if(cut.checked&&view==='tower'&&model.userData.part.name.startsWith('Meridian tower ·')){if(m.userData.interiorFloor&&m.userData.interiorStorey!=='ground')m.visible=false;}if(cut.checked&&view==='tunnel'&&/Underground street mass|Underground approach overhead/.test(model.userData.part.name))m.visible=false;if(cut.checked&&(model.userData.part.name.includes('roof plant')||model.userData.part.name.includes('roof lantern')||model.userData.part.name.includes('roof service box')))m.visible=false;});draw();}
const views={"district":{"camera":[240,215,100],"target":[-85,18,-172],"caption":"A rebuilt rim neighborhood: penthouse and galleries occupy one tower above the market courtyard. The adjacent transit station descends to streets directly below. Those streets curve into working freight interiors on the industrial sinkhole rim."},"residence":{"camera":[-91,97,16],"target":[-143,75,-21],"caption":"The cream-and-bronze penthouse sits at 72 m among neighboring crown towers. Its private berth and curved reception terrace connect directly to the upper residential gallery."},"tower":{"camera":[-96,90,-15],"target":[-145,38,-50],"caption":"Seven occupied levels share a tower footprint. Short return stairs connect the penthouse, residential galleries, market floor and basement interchange within the building."},"market":{"camera":[-51,73,-151],"target":[-141,39,-94],"caption":"The market courtyard sits at 36 m directly over the undercity arrival atrium. Cafe, station and clinic face neighboring edges; the tower gallery is a short passage away."},"tunnel":{"camera":[-145,3,-68],"target":[-145,3,-98],"caption":"The tower basement opens into the neighborhood interchange beneath the courtyard. A second entrance from the transit station completes the loop into the shopfront streets."},"undercity":{"camera":[-244,38,-111],"target":[-128,4,-182],"caption":"Grounded street frontages bend toward the industrial rim, with accessible shops, raised galleries and crossbridges. The far market opens directly into the freight works instead of another long tunnel."},"sinkhole":{"camera":[155,92,-105],"target":[-30,-13,-266],"caption":"The hollow retaining shaft is the industrial anchor of the same neighborhood. Freight interiors are built into its western rim, with stacked short stairs reaching the loading apron 30 m below the streets."}};
function frame(name){view=name;const v=views[name];camera.position.fromArray(v.camera);controls.target.fromArray(v.target);document.querySelector('#caption').textContent=v.caption;cut.checked=name==='residence'||name==='tower';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));controls.update();reveal();}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame(b.dataset.view));cut.onchange=reveal;controls.addEventListener('change',draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});const stats=geometryStats(scene);document.querySelector('#stats').textContent=project.parts.length+' editable objects · '+stats.triangles.toLocaleString()+' triangles · 1 unit = 1 metre';const requestedView=new URLSearchParams(location.search).get('view');frame(views[requestedView]?requestedView:'district');
</script></body></html>
