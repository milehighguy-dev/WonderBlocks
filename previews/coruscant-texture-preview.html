<!doctype html><html><head><meta charset="utf-8"><title>Coruscant rooftop textures</title><style>body{margin:24px;background:#18252c;color:#e9eff0;font:15px system-ui}h1{font-size:22px}p{color:#b1c7cb}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:#273942;padding:14px;border-radius:9px}h2{font-size:15px;margin:0 0 10px}canvas{width:100%;aspect-ratio:1;display:block}small{display:block;margin-top:8px;color:#b1c7cb}</style></head><body><h1>Coruscant · Rooftop textures</h1><p>Coruscant surfaces. Each sample shows a 2 × 2 repeat. Available in the Urban texture category.</p><main></main><script type="module">import {SURFACES,surfacePixels} from '../src/materials/surfaces.js';for(const t of SURFACES.filter(s=>s.themes?.includes('Coruscant'))){const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas'),s=document.createElement('small');h.textContent=t.name;s.textContent='';c.width=c.height=256;const ctx=c.getContext('2d'),pixels=new ImageData(new Uint8ClampedArray(surfacePixels(t.id)),128,128);for(const x of [0,128])for(const y of [0,128])ctx.putImageData(pixels,x,y);a.append(h,c,s);document.querySelector('main').append(a);}</script></body></html>
