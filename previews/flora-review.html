<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flora review</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#d6d6cc;color:#e7eee8;font:14px system-ui;overflow:hidden}canvas{display:block}header,aside,footer{position:absolute;background:#203036ed;border:1px solid #506066;border-radius:8px;box-shadow:0 4px 18px #1a24252b}header{top:16px;left:16px;right:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 8px 0 0}select,button,a{font:inherit;color:inherit;border:1px solid #657375;border-radius:5px;background:#2d4248;padding:8px 10px}select{min-width:190px}button,a{cursor:pointer}button:hover,a:hover{background:#435b60}button.active{background:#b2d9c3;color:#1b3132}nav{display:flex;gap:5px;flex-wrap:wrap}a{margin-left:auto;text-decoration:none}aside{top:100px;right:16px;width:230px;padding:16px}aside label{display:flex;align-items:center;gap:8px;margin:0 0 15px}aside input[type=range]{width:100%;accent-color:#b2d9c3}aside .slider{display:block}aside .slider span{display:flex;justify-content:space-between;margin-bottom:7px}aside output{color:#b2d9c3}#reset{width:100%;margin-top:4px}footer{bottom:16px;left:16px;padding:11px 14px;line-height:1.6;max-width:calc(100% - 32px)}#status{color:#b9d2d3}#hint{font-size:12px;color:#bbcccb}@media(max-width:720px){header{top:8px;left:8px;right:8px;gap:7px}h1{font-size:14px}select{min-width:150px}button,a{padding:6px 8px}aside{top:auto;bottom:110px;right:8px;width:180px;padding:10px}footer{bottom:8px;left:8px;font-size:12px}}
</style></head><body>
<header><h1>Flora review</h1><select id="part" aria-label="Flora part" title="Choose a leaf, branch or base to review"></select><nav aria-label="View"><button data-view="orbit" title="View from an angle">Orbit</button><button data-view="front" title="Look at the front">Front</button><button data-view="side" title="Look at the side">Side</button><button data-view="back" title="Look at the back">Back</button><button data-view="above" title="Look down from above">Above</button><button data-view="below" title="Inspect the underside">Below</button></nav><a href="../index.html?demo=flora" title="Open the flora editor">Editor ↗</a></header>
