<!doctype html><html><head><meta charset="utf-8"><title>Route asset candidates</title><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#14242c;color:#e2ece9;display:grid;grid-template-columns:300px 1fr;height:100vh}aside{padding:20px;overflow:auto;border-right:1px solid #405961}h1{font-size:22px;margin:0 0 10px}p{line-height:1.5;color:#b8c9cc}button,a{font:inherit;color:inherit}button{background:#233b44;border:1px solid #48636b;padding:10px;border-radius:5px;cursor:pointer}.list button{display:block;width:100%;text-align:left;margin:6px 0;font-size:12px}.list button.active{background:#a8e5c9;color:#18382c}.list small{display:block;opacity:.75;margin-top:3px}main{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}.controls{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#14242cef;padding:12px;border-radius:7px}.info{position:absolute;bottom:14px;left:14px;right:14px;background:#14242cf2;padding:14px;border-radius:7px}.info strong{display:block;font-size:17px}.info p{margin:6px 0}.info input{width:100%;background:#0d1b21;border:1px solid #405961;color:#cadbdd;padding:8px;font-size:11px}.controls label{display:flex;align-items:center;gap:5px}a{color:#a8e5c9} @media(max-width:700px){body{grid-template-columns:210px 1fr}aside{padding:12px}}</style></head><body><aside><h1>Route candidates</h1><p>22 original meshes from shipped SWBF1/2 assets. These are source previews, ready for inspection in Blender.</p><p><a href="../research/route-assets/route-asset-inventory.csv" download>Full inventory · 228 candidates</a></p><div class="list"></div></aside><main><div class="controls"><button id="home">Frame mesh</button><label><input type="checkbox" id="cut">Peek inside</label><label><input type="checkbox" id="wire">Wireframe</label><span>Drag to orbit · scroll to zoom</span></div><div class="info"><strong id="name"></strong><p id="stats"></p><p id="note"></p><input id="path" readonly aria-label="Original mesh path"></div></main><script type="module">
import * as T from 'three';import {OrbitControls} from '../vendor/OrbitControls.js';
const assets=await fetch('../research/route-assets/route-asset-preview-data.json').then(r=>r.json()),main=document.querySelector('main'),scene=new T.Scene(),camera=new T.PerspectiveCamera(45,1,.1,1000),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.localClippingEnabled=true;renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor('#a5b7bb');main.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement),loader=new T.TextureLoader(),textures=new Map(),plane=new T.Plane(new T.Vector3(0,-1,0),0);scene.add(new T.HemisphereLight(0xffffff,0x536770,2.7));const light=new T.DirectionalLight(0xffeac9,2.5);light.position.set(20,40,30);scene.add(light);let model=null,extent=20;const draw=()=>renderer.render(scene,camera);orbit.addEventListener('change',draw);
const notes={MUS:'Strong hallway family: repeat the rib profile and panel materials. Larger pieces include bends or adjoining room details.',UTA:'Distinct catwalk profile; source pieces already bend. Use a clean cross-section, with brackets placed independently.',DEA:'Imperial hallway family. Prison C is a lightweight starter; the long prison corridor is a detailed reference.',END:'Wooden walkway and ramp pair: useful for a different rail, plank and support treatment.',HOT:'Ice corridor or utility bridge. Cut corridor is a lightweight enclosed route reference.',MYG:'Mygeeto bridge profile with structural supports; keep tall supports optional.',KAS:'Short bridge is a compact Wookiee route reference; check its floor and boundary profile.',POL:'Polis Massa enclosed hallway reference; separate windows and wall surfaces.',RhenVar:'Tunnel kit includes straight, turn and cross pieces. Use irregular wall profiles with a consistent walking channel.',Bespin:'Cloud City skyway kit, distinct from the existing Bespin 1 walkway. Excellent lightweight junction references.',NAB:'Decorative footbridge includes large arch supports. Extract the walkable span and make supports optional.'};
function frame(){orbit.target.set(0,0,0);camera.position.set(extent*1.05,extent*.7,extent*1.3);camera.near=Math.max(.05,extent/1000);camera.far=Math.max(500,extent*20);camera.updateProjectionMatrix();orbit.update();draw();}
function settings(){if(!model)return;model.traverse(m=>{if(m.isMesh){m.material.wireframe=document.querySelector('#wire').checked;m.material.clippingPlanes=document.querySelector('#cut').checked?[plane]:[];m.material.needsUpdate=true;}});draw();}
function show(asset,index){if(model){scene.remove(model);model.traverse(m=>{m.geometry?.dispose();m.material?.dispose();});}model=new T.Group();for(const seg of asset.segments){const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(seg.positions,3));geometry.setIndex(seg.indices);if(seg.uv.length===seg.positions.length/3*2)geometry.setAttribute('uv',new T.Float32BufferAttribute(seg.uv,2));geometry.computeVertexNormals();let map=null;if(seg.texture){if(!textures.has(seg.texture)){const texture=loader.load(seg.texture,draw);texture.colorSpace=T.SRGBColorSpace;texture.wrapS=texture.wrapT=T.RepeatWrapping;textures.set(seg.texture,texture);}map=textures.get(seg.texture);}const material=new T.MeshStandardMaterial({color:map?0xffffff:0xa7b8b9,map,roughness:.85,side:T.DoubleSide});model.add(new T.Mesh(geometry,material));}const box=new T.Box3().setFromObject(model),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());model.position.copy(center).negate();extent=Math.max(size.x,size.y,size.z);plane.constant=size.y*.12;scene.add(model);document.querySelector('#name').textContent=asset.name;document.querySelector('#stats').textContent=asset.source+' · '+asset.triangles.toLocaleString()+' visible triangles · source bounds '+asset.dimensions.join(' × ')+' m';const world=asset.relative.split('\\')[0];document.querySelector('#note').textContent=notes[world]||'Inspect the walking surface and repeatable cross-section before adapting.';document.querySelector('#path').value=asset.path;document.querySelectorAll('.list button').forEach((b,i)=>b.classList.toggle('active',i===index));frame();settings();}
assets.forEach((asset,i)=>{const b=document.createElement('button'),name=document.createElement('span'),detail=document.createElement('small');name.textContent=asset.name;detail.textContent=asset.source+' · '+asset.triangles+' tris';b.append(name,detail);b.onclick=()=>show(asset,i);document.querySelector('.list').append(b);});document.querySelector('#cut').onchange=settings;document.querySelector('#wire').onchange=settings;document.querySelector('#home').onclick=frame;new ResizeObserver(()=>{renderer.setSize(main.clientWidth,main.clientHeight);camera.aspect=main.clientWidth/main.clientHeight;camera.updateProjectionMatrix();draw();}).observe(main);show(assets[0],0);
</script></body></html>
