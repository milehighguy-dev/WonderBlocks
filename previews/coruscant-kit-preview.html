<!doctype html>
<html><head><meta charset="utf-8"><title>Coruscant — reference pieces</title><style>
body{margin:0;background:#b9c8c8;font:14px system-ui;color:#eff6f6}aside{position:relative;margin:10px;background:#203039ed;padding:14px 18px;border-radius:10px;z-index:2}canvas{display:block}h1{font-size:18px;margin:0 0 6px}p{margin:6px 0;color:#c7d7d7}button,a{display:inline-block;background:#344c53;color:white;border:1px solid #536b70;padding:7px 10px;border-radius:5px;margin:3px;text-decoration:none;cursor:pointer}button.active{background:#a0dfbb;color:#19362b}.label{position:absolute;pointer-events:none;transform:translate(-50%,0);background:#203039dc;border-radius:5px;padding:5px 9px;text-align:center;white-space:nowrap}small{display:block;color:#c8d6d6}
</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body><aside><h1>Coruscant · reference pieces</h1><p>Complete solids · 1 grid square = 1 metre · drag to orbit · scroll to zoom</p><nav></nav><a id="save">Download editable sample</a></aside><script type="module">
import * as T from '../vendor/three.module.js';import {OrbitControls} from '../vendor/OrbitControls.js';import {buildPart} from '../src/core/geometry.js';import {makePart} from '../src/core/model.js';
const roofPair=location.search.includes('roof');const entries=roofPair?[['cor-half-round-roof','Half-round roof','Solid · rounded bevels on both sides',-5,0],['cor-roundtop-body','Beveled tower body','Flat top · matching beveled edges',5,0]]:[['cor-shoulder','Curved tower shoulder','7 m high · rounded setback',-6,-5],['cor-swept-spire','Swept spire','8 m high · curved overhang',5,-5],['cor-transfer-deck','Raised landing deck','7 m across · flat top at 2.4 m',-6,6],['cor-bulb-cap','Acorn cap','2.85 m high · place on your own supports',3,6],['cor-curved-strut','Curved support strut','1.5 m high · repeat around a base',9,6]];
const scene=new T.Scene();scene.background=new T.Color('#b9c8c8');const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x516568,2));const sun=new T.DirectionalLight(0xffeed6,3);sun.position.set(-15,25,20);scene.add(sun);scene.add(new T.GridHelper(36,36,0x6e8585,0x94a8a8));
const parts=[],labels=[],objects=[];for(const [id,name,desc,x,z] of entries){const p=makePart(id,{name,position:[x,0,z],color:'#d1cabe'});parts.push(p);const g=buildPart(p);scene.add(g);objects.push(g);const label=document.createElement('div');label.className='label';label.innerHTML=name+'<small>'+desc+'</small>';document.body.append(label);labels.push({label,point:new T.Vector3(x,0,z+2)});const actor=makePart('character-reference',{name:'Scale reference',position:[x-3.8,0,z+1]});parts.push(actor);scene.add(buildPart(actor));}
if(roofPair){for(let i=0;i<3;i++){const body=makePart('cor-roundtop-body',{name:'Tower body '+(i+1),position:[0,i*4,-8],color:'#b7c6c4'});parts.push(body);scene.add(buildPart(body));}const cap=makePart('cor-half-round-roof',{name:'Matching tower roof',position:[0,12,-8],color:'#b7c6c4'});parts.push(cap);scene.add(buildPart(cap));const label=document.createElement('div');label.className='label';label.textContent='Stacked body + roof';document.body.append(label);labels.push({label,point:new T.Vector3(0,0,-7)});}
const controls=new OrbitControls(camera,renderer.domElement);let selected=-1;const buttons=[];function choose(i){selected=i;buttons.forEach((b,j)=>b.classList.toggle('active',j===i+1));const e=entries[i];controls.target.set(e?e[3]:0,e?3:(roofPair?6:2),e?e[4]:0);camera.position.copy(controls.target).add(new T.Vector3(...(e?[10,7,13]:[21,20,30])));controls.update();draw();}
['All pieces',...entries.map(e=>e[1])].forEach((name,j)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>choose(j-1);document.querySelector('nav').append(b);buttons.push(b);});function draw(){renderer.render(scene,camera);labels.forEach(({label,point},i)=>{const p=point.clone().project(camera);label.style.display=(selected>=0&&selected!==i)||p.z>1?'none':'block';label.style.left=(p.x*.5+.5)*innerWidth+'px';label.style.top=renderer.domElement.offsetTop+(-p.y*.5+.5)*renderer.domElement.clientHeight+'px';});}controls.addEventListener('change',draw);function resize(){const height=Math.max(200,innerHeight-renderer.domElement.offsetTop);camera.aspect=innerWidth/height;camera.updateProjectionMatrix();renderer.setSize(innerWidth,height);draw();}addEventListener('resize',resize);const save=document.querySelector('#save');save.href=URL.createObjectURL(new Blob([JSON.stringify({format:'open-building-studio',version:1,name:'Coruscant reference pieces',parts},null,2)],{type:'application/json'}));save.download='coruscant-reference-pieces.json';resize();choose(-1);
</script></body></html>
