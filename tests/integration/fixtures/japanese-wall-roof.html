<!doctype html><meta charset="utf-8"><title>Roof UV inspection</title>
<style>body{margin:0;background:#dce3e3;font:16px sans-serif}header{position:absolute;top:15px;left:20px;background:white;padding:12px;border-radius:8px}canvas{display:block}button{margin:4px;padding:8px}</style>
<header>Japanese wall roof — isolated preview<br><button id="corner">Corner</button><button id="curve">Curve</button><button id="top">Top view</button><button id="angle">Angled view</button><output id="status"></output></header>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module">
import * as T from '/vendor/three.module.js';
import {OrbitControls} from '/vendor/OrbitControls.js';
import {makePart} from '/src/core/model.js';
import {buildPart,disposePart} from '/src/core/geometry.js';
import {japaneseOpenWallDefaults} from '/src/parts/japanese-wall-profile.js';
const scene=new T.Scene();scene.background=new T.Color('#dce3e3');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,100),controls=new OrbitControls(camera,renderer.domElement);controls.target.set(1.5,2.4,4);camera.position.set(6,8,12);controls.update();scene.add(new T.HemisphereLight(0xffffff,0x79786a,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(3,10,7);scene.add(sun);let group;
function build(curved=false){if(group){scene.remove(group);disposePart(group);}const p=makePart('wall-route');p.route.segments[0].run=7;p.route.segments[0].railing={...japaneseOpenWallDefaults(),style:'japanese-roofed'};if(curved)p.route.segments[0].curveAngle=Math.PI/2;else p.route.segments.push({...structuredClone(p.route.segments[0]),run:5,pathStart:{point:[0,0,7],heading:Math.PI/2}});group=buildPart(p,{collision:false});scene.add(group);}
document.querySelector('#corner').onclick=()=>{build();document.querySelector('#status').textContent='Corner';};document.querySelector('#curve').onclick=()=>{build(true);document.querySelector('#status').textContent='Curve';};document.querySelector('#top').onclick=()=>{controls.target.set(2.5,1.4,3.5);camera.position.set(2.5,16,3.51);controls.update();document.querySelector('#status').textContent='Top view';};document.querySelector('#angle').onclick=()=>{controls.target.set(2.5,1.4,3.5);camera.position.set(9,11,14);controls.update();document.querySelector('#status').textContent='Angled view';};build();document.querySelector('#angle').click();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
