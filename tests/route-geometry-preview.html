<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><title>Route geometry regression preview</title><style>body{margin:0;background:#c4d4d5;font:16px sans-serif}p{position:absolute;margin:20px;padding:12px;background:#fff}canvas{display:block}</style></head><body><p>Descending routes: filled stairs · hallway walls · solid railings<br>Drag to orbit and inspect both sides.</p><script type="module">
import * as T from '../vendor/three.module.js';
import {OrbitControls} from '../vendor/OrbitControls.js';
import {makePart} from '../src/core/model.js';import {buildPart} from '../src/core/geometry.js';import {defaultRoute} from '../src/routes/stair-route.js';import {defaultHallway} from '../src/routes/hallway.js';import {defaultRailing} from '../src/routes/railings.js';
const scene=new T.Scene();scene.background=new T.Color('#c4d4d5');const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(17,13,19);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,3,4);orbit.update();scene.add(new T.HemisphereLight(0xffffff,0x65706a,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,12,8);scene.add(sun);scene.add(new T.GridHelper(30,30));
for(let i=0;i<3;i++){const r=defaultRoute();Object.assign(r.segments[0],{run:6,rise:-3,steps:16,fillToGround:i===0});r.segments.push({kind:'landing',run:2,rise:0,steps:1,turn:'straight',fillToGround:i===0},{kind:'stairs',run:3,rise:-1.5,steps:8,turn:'straight',fillToGround:i===0});if(location.search.includes('corners'))r.segments[1].turn='left';if(i===1)for(const s of r.segments)s.hallway={...defaultHallway(),ceiling:false};if(i===2)for(const s of r.segments)s.railing={...defaultRailing(),style:'solid'};scene.add(buildPart(makePart('block',{position:[(i-1)*5,4.32,-1],scale:[1.5,.18,2]})));scene.add(buildPart(makePart('stair-route',{position:[(i-1)*5,4.5,0],route:r})));}
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
